name = "gatekeeper"
main = "gatekeeper-worker.js"
compatibility_date = "2026-11-28"
workers_dev = true

# Website passcode and Developer Mode use separate keys in this namespace.
[[ratelimits]]
name = "PASSWORD_RATE_LIMITER"
namespace_id = "927341806"
[ratelimits.simple]
limit = 10
period = 60

# Cloudflare cron schedules use UTC. These two times cover Melbourne DST:
# Thursday 13:00 UTC = Friday 00:00 Melbourne during AEDT (UTC+11).
# Thursday 14:00 UTC = Friday 00:00 Melbourne during AEST (UTC+10).
[triggers]
crons = ["0 13 * * THU", "0 14 * * THU"]
