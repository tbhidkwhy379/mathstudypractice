<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft | ClassroomSpot</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#f4f5f8;font-family:Arial,Helvetica,sans-serif}
.topbar{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#111319;border-bottom:1px solid #292c35}
.back{appearance:none;border:1px solid #353945;background:#20232c;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.back:hover{background:#2c303b}
.heading{font-size:15px;font-weight:700;letter-spacing:.2px}
.hint{margin-left:auto;color:#9298a6;font-size:12px}
.game-wrap{height:calc(100% - 54px);width:100%;background:#000;position:relative}
#game{display:block;width:100%;height:100%;border:0;background:#000}
#status{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cbd0dc;background:#08090d;font-size:14px}
@media(max-width:560px){.hint{display:none}.topbar{height:50px}.game-wrap{height:calc(100% - 50px)}}
</style>
<script>
(function(){
  try {
    if (sessionStorage.getItem("neuralSiteAccessGranted") !== "1") {
      window.location.replace("./index.html");
    }
  } catch (e) {
    window.location.replace("./index.html");
  }
})();
</script>
</head>
<body>
<header class="topbar">
<button class="back" type="button" onclick="window.location.href='./app.html'">← Back to main</button>
<div class="heading">Minecraft</div>
<div class="hint">Loading Minecraft securely</div>
</header>
<main class="game-wrap">
<div id="status" role="status">Loading Minecraft… The game file is large, so the first load may take a little while.</div>
<iframe id="game" title="Minecraft game" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen hidden></iframe>
</main>
<script>
(async function(){
  var status=document.getElementById('status');
  var frame=document.getElementById('game');
  var gameUrl=null;
  try {
    var response=await fetch('https://mchost.sapktaayush.workers.dev/',{
      method:'GET',
      headers:{'X-Neural-Access':'neural-minecraft-2026-classroomspot'},
      cache:'no-store'
    });
    if(!response.ok) throw new Error('Minecraft server returned HTTP '+response.status+'.');
    var gameBlob=await response.blob();
    if(!gameBlob || gameBlob.size<1000) throw new Error('The game file appears to be empty or incomplete.');
    gameUrl=URL.createObjectURL(gameBlob);
    frame.onload=function(){status.hidden=true;frame.hidden=false;};
    frame.src=gameUrl;
  } catch(error) {
    status.textContent='Could not load Minecraft. '+(error&&error.message?error.message:'Please refresh and try again.');
  }
  window.addEventListener('beforeunload',function(){
    if(gameUrl) URL.revokeObjectURL(gameUrl);
  });
})();
</script>
</body>
</html>
