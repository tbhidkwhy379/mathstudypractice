name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build Scramjet assets
        run: |
          npm install --no-audit --no-fund
          npm run build:unblocker

      - name: Prepare static site and proxy fallback
        run: |
          mkdir -p _site/scram _site/baremux _site/libcurl _site/epoxy _site/backend
          cp -a *.html *.js *.css *.svg *.webp *.json *.png *.ico CNAME _site/ 2>/dev/null || true
          cp -a backend/. _site/backend/
          cp -aL public _site/public
          cp -aL public/scram/. _site/scram/
          cp -aL public/baremux/. _site/baremux/
          cp -aL public/libcurl/. _site/libcurl/
          cp -aL public/epoxy/. _site/epoxy/
          cp scramjet-sw.js _site/scramjet-sw.js
          cp _redirects _site/_redirects
          # GitHub Pages uses this app shell as its deep-route fallback.
          cp app.html _site/404.html
          test -f _site/index.html
          test -f _site/proxy.html
          test -f _site/app.html
          test -f _site/404.html
          test -f _site/scramjet-sw.js
          test -s _site/backend/neural-config.js
          test -f _site/public/unblocker-assets.json
          test -f _site/public/scram/scramjet.all.js
          test -f _site/public/scram/scramjet.wasm.wasm
          test -f _site/public/scram/scramjet.sync.js
          test -f _site/public/baremux/index.js
          test -f _site/public/baremux/worker.js
          test -f _site/public/libcurl/index.mjs
          test -f _site/public/epoxy/index.mjs
          test -f _site/public/libcurl/index.module.js
          test -f _site/public/epoxy/index.module.js
          test -f _site/scram/scramjet.all.js
          test -f _site/scram/scramjet.wasm.wasm
          test -f _site/scram/scramjet.sync.js
          test -f _site/baremux/index.js
          test -f _site/baremux/worker.js
          test -f _site/libcurl/index.mjs
          test -f _site/epoxy/index.mjs
          test -f _site/libcurl/index.module.js
          test -f _site/epoxy/index.module.js
          test -s _site/scram/scramjet.all.js
          test -s _site/scram/scramjet.wasm.wasm
          test -s _site/epoxy/index.module.js
          test -s _site/libcurl/index.module.js
          test ! -L _site/scram/scramjet.all.js
          test ! -L _site/epoxy/index.module.js
          test ! -L _site/libcurl/index.module.js
          test ! -e _site/uv
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
